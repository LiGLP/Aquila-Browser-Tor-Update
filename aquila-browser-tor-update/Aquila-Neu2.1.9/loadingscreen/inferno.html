<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquila Loading – Inferno</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .ember-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

        .ember {
            position: absolute;
            border-radius: 50% 50% 30% 30%;
            animation: emberRise linear infinite;
            will-change: transform, opacity;
        }

        @keyframes emberRise {
            0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0.9; }
            50%  { transform: translateY(-45vh) translateX(var(--drift)) scale(0.6); opacity: 0.6; }
            100% { transform: translateY(-90vh) translateX(calc(var(--drift)*1.8)) scale(0.1); opacity: 0; }
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%);
            pointer-events: none; z-index: 1;
        }

        .heat-haze {
            position: fixed; bottom: 0; left: 0;
            width: 100%; height: 35%;
            background: linear-gradient(0deg, rgba(255,80,0,0.08) 0%, transparent 100%);
            animation: heatPulse 3s ease-in-out infinite alternate;
            pointer-events: none; z-index: 1;
        }

        @keyframes heatPulse {
            0%   { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .loading-container {
            position: relative; z-index: 5;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-ring-wrap {
            width: 130px; height: 130px;
            margin: 0 auto 36px;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .ring {
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .ring-1 {
            border-color: rgba(255,100,0,0.7);
            box-shadow: 0 0 18px rgba(255,100,0,0.5), inset 0 0 18px rgba(255,100,0,0.1);
            animation: rotateCW 3s linear infinite;
        }

        .ring-2 { inset: 14px; border-color: rgba(255,60,0,0.5); animation: rotateCCW 2.4s linear infinite; }
        .ring-3 { inset: 28px; border-color: rgba(255,180,0,0.4); animation: rotateCW 1.8s linear infinite; }

        @keyframes rotateCW  { to { transform: rotate(360deg); } }
        @keyframes rotateCCW { to { transform: rotate(-360deg); } }

        .logo-icon {
            position: relative;
            filter: drop-shadow(0 0 16px rgba(255,120,0,0.9));
            animation: iconPulse 2s ease-in-out infinite alternate;
        }

        @keyframes iconPulse {
            0%   { filter: drop-shadow(0 0 12px rgba(255,80,0,0.8)); }
            100% { filter: drop-shadow(0 0 28px rgba(255,180,0,1)); }
        }

        .loading-title {
            font-size: 52px; font-weight: 800; letter-spacing: 4px;
            background: linear-gradient(180deg, #ffcc00 0%, #ff6600 50%, #cc2200 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 16px rgba(255,100,0,0.6));
            animation: flameTitlePulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes flameTitlePulse {
            0%   { filter: drop-shadow(0 0 12px rgba(255,80,0,0.5)); }
            100% { filter: drop-shadow(0 0 30px rgba(255,180,0,0.8)); }
        }

        .loading-subtitle {
            font-size: 13px; letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,160,60,0.7);
            margin-top: 8px; margin-bottom: 44px;
        }

        .bar-track {
            width: 300px; height: 4px;
            background: rgba(255,60,0,0.15);
            margin: 0 auto 14px;
            position: relative; overflow: visible;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #cc2200, #ff6600, #ffcc00);
            box-shadow: 0 0 14px rgba(255,120,0,0.9), 0 0 30px rgba(255,80,0,0.4);
            animation: barAnim 3s ease-in-out forwards;
        }

        @keyframes barAnim {
            0%  { width: 0%; }
            65% { width: 100%; }
            100%{ width: 100%; }
        }

        .loading-text {
            font-size: 11px; letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,120,40,0.55);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50%       { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="ember-field" id="embers"></div>
    <div class="vignette"></div>
    <div class="heat-haze"></div>

    <div class="loading-container">
        <div class="logo-ring-wrap">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
                    <defs>
                        <linearGradient id="infCrownGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="#cc2200"/>
                            <stop offset="50%" stop-color="#ff6600"/>
                            <stop offset="100%" stop-color="#ffcc00"/>
                        </linearGradient>
                    </defs>
                    <path fill="url(#infCrownGrad)" d="M5,16L3,5L8.5,10L12,4L15.5,10L21,5L19,16H5M19,19C19,19.6 18.6,20 18,20H6C5.4,20 5,19.6 5,19V18H19V19Z"/>
                </svg>
            </div>
        </div>
        <h1 class="loading-title">Aquila</h1>
        <p class="loading-subtitle" id="subtitle">Fast, Modern, Powerful</p>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <p class="loading-text">Loading...</p>
    </div>

    <audio id="loading-sound"></audio>

    <script>
        const field = document.getElementById('embers');
        const frag = document.createDocumentFragment();
        const colors = ['rgba(255,100,0,0.9)','rgba(255,60,0,0.8)','rgba(255,160,20,0.85)','rgba(200,30,0,0.7)'];

        for (let i = 0; i < 35; i++) {
            const e = document.createElement('div');
            e.className = 'ember';
            const sz = Math.random() * 5 + 2;
            const drift = (Math.random() - 0.5) * 120;
            e.style.cssText = `width:${sz}px;height:${sz*1.4}px;left:${Math.random()*100}%;bottom:${Math.random()*20}%;background:${colors[Math.floor(Math.random()*colors.length)]};--drift:${drift}px;animation-duration:${Math.random()*4+3}s;animation-delay:${Math.random()*5}s;box-shadow:0 0 ${sz*2}px ${colors[0]};`;
            frag.appendChild(e);
        }
        field.appendChild(frag);

        const { ipcRenderer } = require('electron');

        async function init() {
            const audio = document.getElementById('loading-sound');
            try {
                const data = await ipcRenderer.invoke('get-data');
                const settings = data?.settings || {};
                if (settings.loadingSubtitle) {
                    document.getElementById('subtitle').textContent = settings.loadingSubtitle;
                }
                const sound = settings.loadingSound || 'aquila.mp3';
                audio.src = `sounds/${sound}`;
                audio.play().catch(console.error);
            } catch (e) {
                audio.src = 'sounds/aquila.mp3';
                audio.play().catch(console.error);
            }
        }

        init();

        ipcRenderer.on('subtitle', (event, text) => {
            if (text) document.getElementById('subtitle').textContent = text;
        });

        ipcRenderer.on('sound', (event, sound) => {
            const audio = document.getElementById('loading-sound');
            audio.src = `sounds/${sound}`;
            audio.play().catch(console.error);
        });
    </script>
</body>
</html>
