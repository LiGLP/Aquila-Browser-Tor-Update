<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquila Loading – Synthwave</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #0d0015;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-floor {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: 55%;
            perspective: 400px;
            z-index: 0;
        }

        .grid-inner {
            width: 100%; height: 100%;
            transform: rotateX(60deg);
            transform-origin: top center;
            background-image:
                linear-gradient(rgba(255,0,200,0.35) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,200,0.35) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            0%   { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        .sun {
            position: fixed;
            bottom: 44%; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 100px;
            background: linear-gradient(180deg, #ff6ec7 0%, #ff2d78 40%, #ff6b00 100%);
            border-radius: 200px 200px 0 0;
            z-index: 1;
            box-shadow: 0 0 60px rgba(255,80,120,0.6), 0 0 120px rgba(255,80,120,0.3);
            overflow: hidden;
        }

        .sun-lines {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-evenly;
            padding-top: 30%;
        }

        .sun-lines span { display: block; width: 100%; height: 3px; background: #0d0015; }

        .mountains {
            position: fixed;
            bottom: 44%; left: 0;
            width: 100%; z-index: 2;
        }

        .mountains svg { width: 100%; height: 120px; display: block; }

        .scanlines {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
            );
            pointer-events: none; z-index: 10;
        }

        .loading-container {
            position: relative; z-index: 5;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
            margin-top: -120px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .sw-crown-wrap {
            width: 100px; height: 100px;
            margin: 0 auto 32px;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .sw-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid rgba(255,45,120,0.6);
            box-shadow: 0 0 16px rgba(255,45,120,0.3);
            animation: swSpin 4s linear infinite;
        }

        .sw-ring-2 { inset: 14px; border-color: rgba(160,0,255,0.4); animation: swSpin 3s linear infinite reverse; }

        .sw-crown { filter: drop-shadow(0 0 14px rgba(255,45,120,0.9)); animation: swCrownPulse 2s ease-in-out infinite alternate; }

        @keyframes swSpin { to { transform: rotate(360deg); } }
        @keyframes swCrownPulse {
            0%   { filter: drop-shadow(0 0 10px rgba(255,45,120,0.7)); }
            100% { filter: drop-shadow(0 0 24px rgba(160,0,255,1)); }
        }

        .loading-title {
            font-size: 64px; font-weight: 900;
            letter-spacing: 8px; text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px #ff2d78;
            text-shadow: 0 0 20px rgba(255,45,120,0.8), 0 0 60px rgba(255,45,120,0.4);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0%   { text-shadow: 0 0 20px rgba(255,45,120,0.8), 0 0 60px rgba(255,45,120,0.4); -webkit-text-stroke-color: #ff2d78; }
            100% { text-shadow: 0 0 30px rgba(130,0,255,0.9), 0 0 80px rgba(130,0,255,0.5); -webkit-text-stroke-color: #a000ff; }
        }

        .loading-subtitle {
            font-size: 13px; letter-spacing: 6px;
            text-transform: uppercase; color: #ff6ec7;
            margin-top: 8px; margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255,110,199,0.8);
        }

        .progress-track {
            width: 320px; height: 3px;
            background: rgba(255,45,120,0.2);
            margin: 0 auto 12px;
            border: 1px solid rgba(255,45,120,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a000ff, #ff2d78, #ff6ec7);
            box-shadow: 0 0 12px rgba(255,45,120,0.8);
            animation: progressAnim 3s ease-in-out forwards;
        }

        @keyframes progressAnim {
            0%  { width: 0%; }
            60% { width: 100%; }
            100%{ width: 100%; }
        }

        .loading-text {
            font-size: 11px; letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,110,199,0.6);
            animation: blink 1.4s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50%       { opacity: 1; }
        }

        .corner { position: fixed; width: 20px; height: 20px; z-index: 20; }
        .corner-tl { top: 16px; left: 16px;  border-top: 2px solid #ff2d78; border-left: 2px solid #ff2d78; }
        .corner-tr { top: 16px; right: 16px; border-top: 2px solid #ff2d78; border-right: 2px solid #ff2d78; }
        .corner-bl { bottom: 16px; left: 16px;  border-bottom: 2px solid #ff2d78; border-left: 2px solid #ff2d78; }
        .corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid #ff2d78; border-right: 2px solid #ff2d78; }
    </style>
</head>
<body>

    <div class="grid-floor"><div class="grid-inner"></div></div>

    <div class="sun">
        <div class="sun-lines">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="mountains">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="0,120 200,20 400,80 600,10 800,70 1000,5 1200,60 1440,30 1440,120" fill="#1a0030"/>
            <polygon points="0,120 150,50 300,90 500,30 700,85 900,20 1100,75 1300,40 1440,65 1440,120" fill="#0d0015"/>
        </svg>
    </div>

    <div class="scanlines"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="loading-container">
        <div class="sw-crown-wrap">
            <div class="sw-ring"></div>
            <div class="sw-ring sw-ring-2"></div>
            <svg class="sw-crown" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="42" height="42">
                <defs>
                    <linearGradient id="swCrownGrad" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="#a000ff"/>
                        <stop offset="100%" stop-color="#ff6ec7"/>
                    </linearGradient>
                </defs>
                <path fill="url(#swCrownGrad)" d="M5,16L3,5L8.5,10L12,4L15.5,10L21,5L19,16H5M19,19C19,19.6 18.6,20 18,20H6C5.4,20 5,19.6 5,19V18H19V19Z"/>
            </svg>
        </div>
        <h1 class="loading-title">Aquila</h1>
        <p class="loading-subtitle" id="subtitle">Fast, Modern, Powerful</p>
        <div class="progress-track"><div class="progress-fill"></div></div>
        <p class="loading-text">Loading...</p>
    </div>

    <audio id="loading-sound"></audio>

    <script>
        const { ipcRenderer } = require('electron');

        async function init() {
            const audio = document.getElementById('loading-sound');
            try {
                const data = await ipcRenderer.invoke('get-data');
                const settings = data?.settings || {};
                if (settings.loadingSubtitle) {
                    document.getElementById('subtitle').textContent = settings.loadingSubtitle;
                }
                const sound = settings.loadingSound || 'aquila.mp3';
                audio.src = `sounds/${sound}`;
                audio.play().catch(console.error);
            } catch (e) {
                audio.src = 'sounds/aquila.mp3';
                audio.play().catch(console.error);
            }
        }

        init();

        ipcRenderer.on('subtitle', (event, text) => {
            if (text) document.getElementById('subtitle').textContent = text;
        });

        ipcRenderer.on('sound', (event, sound) => {
            const audio = document.getElementById('loading-sound');
            audio.src = `sounds/${sound}`;
            audio.play().catch(console.error);
        });
    </script>
</body>
</html>
