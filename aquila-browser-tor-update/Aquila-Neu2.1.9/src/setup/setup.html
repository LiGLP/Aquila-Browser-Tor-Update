<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquila Setup</title>
    <link rel="stylesheet" href="setup.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="setup-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="setup-steps">
            <div class="step active" data-step="1">
                <div class="step-icon">
                    <svg viewBox="0 0 24 24" fill="white" width="32" height="32">
                        <path d="M5,16L3,5L8.5,10L12,4L15.5,10L21,5L19,16H5M19,19C19,19.6 18.6,20 18,20H6C5.4,20 5,19.6 5,19V18H19V19Z"/>
                    </svg>
                </div>
                <h2>Willkommen bei Aquila</h2>
                <p class="step-desc">Wähle deine bevorzugte Sprache</p>
                <div class="option-grid lang-grid">
                    <div class="option-card selected" data-lang="de">
                        <div class="option-flag">🇩🇪</div>
                        <span>Deutsch</span>
                    </div>
                    <div class="option-card" data-lang="en">
                        <div class="option-flag">🇬🇧</div>
                        <span>English</span>
                    </div>
                </div>
            </div>

            <div class="step" data-step="2">
                <div class="step-icon">
                    <svg viewBox="0 0 24 24" fill="white" width="32" height="32">
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1-.01-.83.67-1.5 1.49-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                    </svg>
                </div>
                <h2>Wähle dein Theme</h2>
                <p class="step-desc">Du kannst es jederzeit in den Einstellungen ändern</p>
                <div class="option-grid theme-grid">
                    <div class="theme-card selected" data-theme="aquila">
                        <div class="theme-swatch aquila-swatch"></div>
                        <span>Aquila</span>
                    </div>
                    <div class="theme-card" data-theme="red-dusk">
                        <div class="theme-swatch red-swatch"></div>
                        <span>Rote Dämmerung</span>
                    </div>
                    <div class="theme-card" data-theme="yellow-soul">
                        <div class="theme-swatch yellow-swatch"></div>
                        <span>Gelbe Seele</span>
                    </div>
                    <div class="theme-card" data-theme="nico">
                        <div class="theme-swatch nico-swatch"></div>
                        <span>Nico</span>
                    </div>
                    <div class="theme-card" data-theme="white-rose">
                        <div class="theme-swatch white-swatch"></div>
                        <span>Weiße Rose</span>
                    </div>
                    <div class="theme-card" data-theme="dark-night">
                        <div class="theme-swatch dark-swatch"></div>
                        <span>Dunkle Nacht</span>
                    </div>
                </div>
            </div>

            <div class="step" data-step="3">
                <div class="step-icon ready-icon">
                    <svg viewBox="0 0 24 24" fill="white" width="32" height="32">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                    </svg>
                </div>
                <h2>Alles bereit!</h2>
                <p class="step-desc">Dein Browser ist konfiguriert</p>
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="summary-label">Sprache</div>
                        <div class="summary-value" id="selected-lang">Deutsch</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">Theme</div>
                        <div class="summary-value" id="selected-theme">Aquila</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="setup-nav">
            <button class="btn btn-back" id="btn-back" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
                </svg>
                Zurück
            </button>
            <button class="btn btn-next" id="btn-next">
                Weiter
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="setup.js"></script>
</body>
</html>
